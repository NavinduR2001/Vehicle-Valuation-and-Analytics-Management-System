name: Deploy Backend to Azure App Service

on:
  # Triggers when any PR is merged into master OR direct push to master
  push:
    branches:
      - master

  # Also trigger manually from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          cd backend
          npm install --omit=dev

      - name: Zip backend for deployment
        run: |
          cd backend
          zip -r ../backend-release.zip . -x "*.git*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: vv-valuation-api-2025
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend-release.zip
